name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'data/**'
      - '.github/workflows/**'
      - '.gitattributes'
  pull_request:
    paths: ['frontend/**', 'data/**', '.github/workflows/**', '.gitattributes']
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  queue: max

jobs:
  verify:
    uses: ./.github/workflows/verify-narrative.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Check the published home page and entry script
        timeout-minutes: 3
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          fetch() { curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 4 --max-time 15 "$@"; }
          html=$(fetch "${PAGE_URL%/}/")
          grep -Fq '<title>山海寻踪</title>' <<< "$html"
          entry=$(sed -n 's/.*<script type="module"[^>]* src="\([^"]*\)".*/\1/p' <<< "$html")
          [[ "$entry" == /* ]]
          origin=$(cut -d/ -f1-3 <<< "$PAGE_URL")
          fetch --output /dev/null "$origin$entry"
