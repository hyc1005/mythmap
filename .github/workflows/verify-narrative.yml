name: Verify complete story playback

on:
  workflow_call:
    secrets:
      TIANDITU_BROWSER_KEY:
        required: false

permissions:
  contents: read
  pages: read

concurrency:
  group: narrative-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATLAS_BROWSERS: chromium,webkit
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify:data
      - name: Verify content inventory and source labels
        run: |
          python ../data/audit_shanhaijing.py --check
          python ../data/build_source_inventory.py --check
          python ../data/english_review.py
          python ../data/build_geography_basemap.py --check
      - run: npm run verify:assets
      - run: python ../data/asset_packages.py check --catalog ../data/asset-bundles.json
      - run: npm run verify:cache
      - name: Identify WebKit cache
        id: webkit-identity
        run: |
          PW_VERSION=$(node -p "require('playwright/package.json').version")
          echo "key=pw-webkit-v1-${RUNNER_OS}-${RUNNER_ARCH}-$(lsb_release -rs)-${PW_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: webkit-cache
        with:
          path: |
            ${{ github.workspace }}/.pw-browsers/webkit-*
            ${{ github.workspace }}/.pw-browsers/ffmpeg-*
          key: ${{ steps.webkit-identity.outputs.key }}
      - name: Use the public Ubuntu package mirror
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - run: npx playwright install --with-deps --only-shell chromium webkit
        timeout-minutes: 15
      - name: Save verified WebKit installation
        if: github.ref == 'refs/heads/main' && steps.webkit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ github.workspace }}/.pw-browsers/webkit-*
            ${{ github.workspace }}/.pw-browsers/ffmpeg-*
          key: ${{ steps.webkit-identity.outputs.key }}
      - run: npm run build -- --base /
      - name: Verify local basemap without external credentials
        env:
          ATLAS_MISSING_KEY: '1'
        run: node scripts/with-preview.mjs -- node scripts/verify-geography.mjs
      - name: Verify root-path build
        env:
          ATLAS_BROWSERS: chromium
        run: node scripts/with-preview.mjs -- node --input-type=module -e "await import('./scripts/verify-publish.mjs'); await import('./scripts/verify-repairs.mjs');"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      base: ${{ steps.path.outputs.base }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: |
            frontend/public
            frontend/scripts
            frontend/src
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Read Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Determine publishing path
        id: path
        env:
          PAGES_CONFIGURED: ${{ steps.pages.outcome == 'success' }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "$PAGES_CONFIGURED" == true ]]; then base="${PAGES_BASE_PATH}/";
          elif [[ "$repository" == *.github.io ]]; then base=/; else base="/$repository/"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - run: npm run build -- --base "${{ steps.path.outputs.base }}"
      - run: npm run verify:publish
      - name: Upload browser verification build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-verification-site
          path: frontend/dist
          retention-days: 1
      - name: Upload verified site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: frontend/dist

  browser:
    name: Browser ${{ matrix.browser }} / ${{ matrix.suite.name }}${{ matrix.suite.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        suite:
          - name: atlas
            scripts: verify-geography.mjs verify-exploration.mjs verify-onboarding.mjs verify-repairs.mjs verify-design.mjs verify-guided-tour.mjs verify-reading.mjs verify-resume.mjs verify-search.mjs verify-bestiary.mjs verify-ux.mjs
          - name: southern-cards
            scripts: verify-nanshan.mjs
            cards: records
          - name: southern-cards
            shard: ' / navigation'
            scripts: verify-nanshan.mjs
            cards: navigation
          - name: southern-reader
            scripts: verify-reader.mjs
          - name: western
            scripts: verify-xishan.mjs
            cards: records
          - name: western
            shard: ' / navigation'
            scripts: verify-xishan.mjs
            cards: navigation
          - name: stories
            scripts: verify-discovery.mjs verify-place-search.mjs verify-map-frame.mjs verify-playback-speed.mjs
        include:
          - browser: chromium
            suite:
              name: central-current
              scripts: verify-zhongshan.mjs
          - browser: chromium
            suite:
              name: northern
              scripts: verify-beishan.mjs
          - browser: webkit
            suite:
              name: central-current
              scripts: verify-zhongshan.mjs
              languages: zh
          - browser: webkit
            suite:
              name: central-current
              shard: ' / en'
              scripts: verify-zhongshan.mjs
              languages: en
          - browser: webkit
            suite:
              name: northern
              scripts: verify-beishan.mjs
              languages: zh
          - browser: webkit
            suite:
              name: northern
              shard: ' / en'
              scripts: verify-beishan.mjs
              languages: en
          - browser: chromium
            suite:
              name: narrative
              scripts: verify-locale.mjs verify-narrative.mjs
              skip_layout: '1'
              regression_only: '1'
          - browser: chromium
            suite:
              name: narrative
              shard: ' / layout'
              scripts: verify-narrative.mjs
              layout_only: '1'
          - browser: chromium
            suite:
              name: narrative
              shard: ' / stories'
              scripts: verify-narrative.mjs
              skip_layout: '1'
              story_only: '1'
    env:
      ATLAS_BROWSER: ${{ matrix.browser }}
      ATLAS_BROWSERS: ${{ matrix.browser }}
      ATLAS_BASE: ${{ needs.build.outputs.base }}
      ATLAS_SCRIPTS: ${{ matrix.suite.scripts }}
      ATLAS_SUITE: ${{ matrix.suite.name }}
      ATLAS_CARD_SUITE: ${{ matrix.suite.cards }}
      ATLAS_LANGUAGES: ${{ matrix.suite.languages }}
      ATLAS_LAYOUT_ONLY: ${{ matrix.suite.layout_only }}
      ATLAS_SKIP_LAYOUT: ${{ matrix.suite.skip_layout }}
      ATLAS_REGRESSION_ONLY: ${{ matrix.suite.regression_only }}
      ATLAS_STORY_ONLY: ${{ matrix.suite.story_only }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/frontend/artwork-source/**/*.png
            !/frontend/artwork-source/**/*.webp
            !/data/reference-scans/**/*.jpg
      - name: Retain original assets required by this suite
        run: python ../data/light_checkout.py --profile "$ATLAS_SUITE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Identify WebKit cache
        if: matrix.browser == 'webkit'
        id: webkit-identity
        run: |
          PW_VERSION=$(node -p "require('playwright/package.json').version")
          echo "key=pw-webkit-v1-${RUNNER_OS}-${RUNNER_ARCH}-$(lsb_release -rs)-${PW_VERSION}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.browser == 'webkit'
        id: webkit-cache
        with:
          path: |
            ${{ github.workspace }}/.pw-browsers/webkit-*
            ${{ github.workspace }}/.pw-browsers/ffmpeg-*
          key: ${{ steps.webkit-identity.outputs.key }}
      - name: Use the public Ubuntu package mirror
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - name: Install browser and system dependencies
        run: |
          if [[ "$ATLAS_BROWSER" == chromium ]]; then
            npx playwright install --with-deps --only-shell chromium
          else
            npx playwright install --with-deps webkit
          fi
        timeout-minutes: 15
      - name: Download the shared publishing build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-verification-site
          path: frontend/dist
      - name: Verify browser suite
        run: |
          node scripts/with-preview.mjs --base "$ATLAS_BASE" -- bash -ec '
            for script in $ATLAS_SCRIPTS; do
              echo "::group::Verifying $script with $ATLAS_BROWSERS"
              node "scripts/$script"
              echo "::endgroup::"
            done
          '

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-${{ matrix.browser }}-${{ matrix.suite.name }}-${{ strategy.job-index }}
          path: output/qa/browser-failures/
          if-no-files-found: ignore
          retention-days: 7
