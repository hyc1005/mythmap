name: Verify complete story playback

on:
  workflow_call:
    secrets:
      TIANDITU_BROWSER_KEY:
        required: false

permissions:
  contents: read
  pages: read

concurrency:
  group: narrative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      base: ${{ steps.path.outputs.base }}
    env:
      ATLAS_BROWSERS: chromium,webkit
      VITE_TIANDITU_KEY: ${{ github.event_name == 'pull_request' && 'mock-browser-key' || secrets.TIANDITU_BROWSER_KEY }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify backend without a database
        working-directory: .
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pytest backend/tests
      - run: npm run verify:data
      - name: Verify content inventory and source labels
        run: |
          python ../data/audit_shanhaijing.py --check
          python ../data/build_source_inventory.py --check
      - run: npm run verify:cache
      - name: Use the public Ubuntu package mirror
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 15
      - run: npm run build -- --base /
        env:
          VITE_TIANDITU_KEY: ''
      - name: Verify missing basemap credentials
        env:
          ATLAS_MISSING_KEY: '1'
        run: node scripts/with-preview.mjs -- node scripts/verify-geography.mjs
      - name: Verify root-path build
        env:
          ATLAS_BROWSERS: chromium
        run: node scripts/with-preview.mjs -- node --input-type=module -e "await import('./scripts/verify-publish.mjs'); await import('./scripts/verify-repairs.mjs');"
      - name: Read Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Determine publishing path
        id: path
        env:
          PAGES_CONFIGURED: ${{ steps.pages.outcome == 'success' }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "$PAGES_CONFIGURED" == true ]]; then base="${PAGES_BASE_PATH}/";
          elif [[ "$repository" == *.github.io ]]; then base=/; else base="/$repository/"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Require a browser key for publication
        if: github.event_name != 'pull_request'
        run: |
          if [[ -z "$VITE_TIANDITU_KEY" ]]; then
            echo "::error::Configure the repository Actions secret TIANDITU_BROWSER_KEY with a Tianditu browser application key."
            exit 1
          fi
      - run: npm run build -- --base "${{ steps.path.outputs.base }}"
      - run: npm run verify:publish
      - name: Upload browser verification build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-verification-site
          path: frontend/dist
          retention-days: 1
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: frontend/dist

  browser:
    name: Browser ${{ matrix.browser }} / ${{ matrix.suite.name }}
    needs: narrative
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        suite:
          - name: atlas
            scripts: verify-geography.mjs verify-exploration.mjs verify-onboarding.mjs verify-repairs.mjs verify-design.mjs verify-guided-tour.mjs verify-reading.mjs verify-resume.mjs verify-search.mjs verify-bestiary.mjs verify-ux.mjs
          - name: central-current
            scripts: verify-zhongshan.mjs
          - name: southern-cards
            scripts: verify-nanshan.mjs
          - name: southern-reader
            scripts: verify-reader.mjs
          - name: western
            scripts: verify-xishan.mjs
          - name: northern
            scripts: verify-beishan.mjs
          - name: stories
            scripts: verify-discovery.mjs verify-place-search.mjs verify-map-frame.mjs verify-playback-speed.mjs
        include:
          - browser: chromium
            suite:
              name: narrative
              scripts: verify-locale.mjs verify-narrative.mjs
    env:
      ATLAS_BROWSER: ${{ matrix.browser }}
      ATLAS_BROWSERS: ${{ matrix.browser }}
      ATLAS_BASE: ${{ needs.narrative.outputs.base }}
      ATLAS_SCRIPTS: ${{ matrix.suite.scripts }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Use the public Ubuntu package mirror
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
      - run: npx playwright install --with-deps "${{ matrix.browser }}"
        timeout-minutes: 15
      - name: Download the shared publishing build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: browser-verification-site
          path: frontend/dist
      - name: Verify browser suite
        run: |
          for script in $ATLAS_SCRIPTS; do
            echo "Verifying $script with $ATLAS_BROWSERS"
            if [[ "$script" == "verify-beishan.mjs" ]]; then
              node "scripts/$script"
            else
              node scripts/with-preview.mjs --base "$ATLAS_BASE" -- node "scripts/$script"
            fi
          done

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-${{ matrix.browser }}-${{ matrix.suite.name }}
          path: output/qa/browser-failures/
          if-no-files-found: ignore
          retention-days: 7
