name: Verify complete story playback

on:
  workflow_call:
    secrets:
      TIANDITU_BROWSER_KEY:
        required: false

permissions:
  contents: read
  pages: read

concurrency:
  group: narrative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ATLAS_BROWSERS: chromium,firefox,webkit
      VITE_TIANDITU_KEY: ${{ github.event_name == 'pull_request' && 'mock-browser-key' || secrets.TIANDITU_BROWSER_KEY }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify backend without a database
        working-directory: .
        run: |
          python -m pip install -r backend/requirements-dev.txt
          python -m pytest backend/tests
      - run: npm run verify:data
      - run: npm run verify:cache
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build -- --base /
        env:
          VITE_TIANDITU_KEY: ''
      - name: Verify missing basemap credentials
        env:
          ATLAS_MISSING_KEY: '1'
        run: node scripts/with-preview.mjs -- node scripts/verify-geography.mjs
      - name: Verify root-path build
        env:
          ATLAS_BROWSERS: chromium
        run: node scripts/with-preview.mjs -- node --input-type=module -e "await import('./scripts/verify-publish.mjs'); await import('./scripts/verify-repairs.mjs');"
      - name: Read Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Determine publishing path
        id: path
        env:
          PAGES_CONFIGURED: ${{ steps.pages.outcome == 'success' }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "$PAGES_CONFIGURED" == true ]]; then base="${PAGES_BASE_PATH}/";
          elif [[ "$repository" == *.github.io ]]; then base=/; else base="/$repository/"; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Require a browser key for publication
        if: github.event_name != 'pull_request'
        run: |
          if [[ -z "$VITE_TIANDITU_KEY" ]]; then
            echo "::error::Configure the repository Actions secret TIANDITU_BROWSER_KEY with a Tianditu browser application key."
            exit 1
          fi
      - run: npm run build -- --base "${{ steps.path.outputs.base }}"
      - run: npm run verify:publish
      - name: Verify bilingual content
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-locale.mjs
      - name: Verify exploration and sharing
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-exploration.mjs
      - name: Verify failure recovery
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-repairs.mjs
      - name: Verify layout and artwork
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-design.mjs
      - name: Verify guided tours
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-guided-tour.mjs
      - name: Verify reading and focus restoration
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-reading.mjs
      - name: Verify continue reading
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-resume.mjs
      - name: Verify global search
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-search.mjs
      - name: Verify geographic atlas
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-geography.mjs
      - name: Verify shared map frame and notices
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-map-frame.mjs
      - name: Verify animation speed
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-playback-speed.mjs
      - name: Verify complete story playback
        run: node scripts/with-preview.mjs --base "${{ steps.path.outputs.base }}" -- node scripts/verify-narrative.mjs
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: frontend/dist
