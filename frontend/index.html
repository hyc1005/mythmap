<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#eee2c5" />
    <meta name="description" content="以《山海经》篇目方位关系和七章神话叙事构成的互动山海图。" />
    <title>山海寻踪 · 一卷山海，七章神话</title>
    <style>
      html { background:#f5efdf; }
      html.splash-lock { overflow:hidden; }
      #splash-dialog { position:fixed; inset:0; width:100%; height:100%; max-width:none; max-height:none; margin:0; padding:0; border:0; overflow:hidden; background:#f5efdf; color:#332c24; opacity:1; transition:opacity .65s ease; }
      #splash-dialog::backdrop { background:transparent; }
      #splash-dialog.splash-leaving { opacity:0; }
      #splash-placeholder { position:absolute; inset:0; display:grid; place-items:center; margin:0; font:clamp(26px,5vw,48px)/1.5 "Songti SC","Noto Serif SC",serif; letter-spacing:.24em; }
      #splash-placeholder[hidden] { display:none; }
      #splash-enter { position:absolute; right:20px; bottom:max(16px,env(safe-area-inset-bottom)); z-index:30; min-width:88px; min-height:44px; padding:12px 16px; border:1px solid #69513955; border-radius:2px; background:#f5efdfd9; color:#493527; font:13px/1.4 "Songti SC",serif; letter-spacing:.15em; cursor:pointer; }
      #splash-enter:focus-visible { outline:2px solid #a4321b; outline-offset:3px; }
      @media (prefers-reduced-motion:reduce) { #splash-dialog { transition:none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <dialog id="splash-dialog" aria-label="山海寻踪开屏" aria-describedby="splash-description">
      <div id="splash-stage" aria-hidden="true"></div>
      <p id="splash-placeholder" hidden></p>
      <span id="splash-description" hidden>水墨开篇，可随时进入网站，也可按 Esc 跳过。</span>
      <button id="splash-enter" type="button">进入网站</button>
    </dialog>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
