<svg class="shanhai-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" color="#9e4935" fill="none">
  <style>
    .shanhai-mark .mark-sun { transform: translateY(5px); opacity: .7; }
    @keyframes mark-dawn { 0%, 100% { transform: translateY(5px); opacity: .7; } 40%, 65% { transform: translateY(-3px); opacity: 1; } }
    @keyframes mark-tide { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1.28; } }
    @media (prefers-reduced-motion: no-preference) {
      .myth-header>a:focus-visible .mark-sun { animation: mark-dawn 6s ease-in-out infinite; }
      .myth-header>a:focus-visible .mark-waves { stroke-dasharray: 1.12 .16; animation: mark-tide 5s linear infinite; }
    }
    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      .shanhai-mark:hover .mark-sun, .myth-header>a:hover .mark-sun { animation: mark-dawn 6s ease-in-out infinite; }
      .shanhai-mark:hover .mark-waves, .myth-header>a:hover .mark-waves { stroke-dasharray: 1.12 .16; animation: mark-tide 5s linear infinite; }
    }
  </style>
  <path d="M6 5h51l2 2v49l-2 3H7l-2-2V8Z" stroke="currentColor" stroke-width="3"/>
  <circle class="mark-sun" cx="18" cy="17" r="4.2" fill="currentColor"/>
  <path d="m10 39 12-17 6 7 8-14 18 24h-8L36 25l-6 14h-5l-3-7-5 7Z" fill="currentColor"/>
  <g class="mark-waves" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
    <path pathLength="1" d="M12 46c8-5 13 5 20 1s13-5 20-1"/>
    <path pathLength="1" d="M12 52c8-5 13 5 20 1s13-5 20-1"/>
  </g>
</svg>
